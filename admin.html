<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Admin — CD2026</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Source+Sans+3:wght@300;400;500;600&display=swap">
<style>
/* ══════════════════════════════════════
   TOKENS
   ══════════════════════════════════════ */
:root {
  --pink: #D14E72;
  --pink-deep: #B8305A;
  --pink-soft: #FCEEF2;
  --pink-mist: #FDF5F7;
  --green-deep: #22594E;
  --green: #318F7D;
  --green-soft: #E6F3EF;
  --saffron: #EB570F;
  --saffron-soft: #FFF0E8;
  --gold: #D4900A;
  --gold-soft: #FFF7E6;
  --bg: #FFFAF8;
  --surface: #FFFFFF;
  --surface-alt: #FDF5F3;
  --text: #2A3530;
  --text-secondary: #5E6E68;
  --text-muted: #8A9A94;
  --border: #EDDDD8;
  --border-light: #F5EBE7;
  --shadow: rgba(180, 48, 90, 0.06);
  --shadow-md: rgba(180, 48, 90, 0.1);
  --radius: 14px;
  --radius-sm: 10px;
  --font-display: 'Cormorant Garamond', Georgia, serif;
  --font-body: 'Source Sans 3', 'Segoe UI', system-ui, sans-serif;
  --danger: #CD1A30;
  --danger-soft: #FFF0F0;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --pink: #D8688A;
    --pink-deep: #A83860;
    --pink-soft: #2E1820;
    --pink-mist: #241418;
    --green-deep: #78C8A8;
    --green: #5CB89F;
    --green-soft: #142820;
    --saffron: #F27535;
    --saffron-soft: #2C1810;
    --gold: #E8A520;
    --gold-soft: #2A2210;
    --bg: #140E10;
    --surface: #221A1E;
    --surface-alt: #2A1E22;
    --text: #E8DED5;
    --text-secondary: #A8988E;
    --text-muted: #706860;
    --border: #3A2830;
    --border-light: #2E2028;
    --shadow: rgba(0,0,0,0.25);
    --shadow-md: rgba(0,0,0,0.35);
    --danger: #FF6B7A;
    --danger-soft: #2E1418;
  }
}
:root[data-theme="dark"] {
  --pink: #D8688A;
  --pink-deep: #A83860;
  --pink-soft: #2E1820;
  --pink-mist: #241418;
  --green-deep: #78C8A8;
  --green: #5CB89F;
  --green-soft: #142820;
  --saffron: #F27535;
  --saffron-soft: #2C1810;
  --gold: #E8A520;
  --gold-soft: #2A2210;
  --bg: #140E10;
  --surface: #221A1E;
  --surface-alt: #2A1E22;
  --text: #E8DED5;
  --text-secondary: #A8988E;
  --text-muted: #706860;
  --border: #3A2830;
  --border-light: #2E2028;
  --shadow: rgba(0,0,0,0.25);
  --shadow-md: rgba(0,0,0,0.35);
  --danger: #FF6B7A;
  --danger-soft: #2E1418;
}

/* ══════════════════════════════════════
   BASE
   ══════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

.container {
  max-width: 640px;
  margin: 0 auto;
  padding: 0 16px;
}

h1, h2, h3 { font-family: var(--font-display); margin: 0; }

/* ══════════════════════════════════════
   LOGIN
   ══════════════════════════════════════ */
#login-screen {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  padding: 16px;
}
.login-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px 32px;
  width: 100%;
  max-width: 380px;
  box-shadow: 0 4px 24px var(--shadow);
  text-align: center;
}
.login-card h1 {
  font-size: 1.7rem;
  color: var(--green-deep);
  margin-bottom: 6px;
}
.login-card .subtitle {
  color: var(--text-muted);
  font-size: 0.9rem;
  margin-bottom: 28px;
}
.login-card .setup-note {
  color: var(--saffron);
  font-size: 0.85rem;
  margin-bottom: 20px;
  padding: 10px 14px;
  background: var(--saffron-soft);
  border-radius: var(--radius-sm);
  text-align: left;
}

/* ══════════════════════════════════════
   FORMS
   ══════════════════════════════════════ */
.field { margin-bottom: 14px; text-align: left; }
.field label {
  display: block;
  font-size: 0.82rem;
  font-weight: 500;
  color: var(--text-secondary);
  margin-bottom: 5px;
}
.field input, .field select, .field textarea {
  width: 100%;
  padding: 10px 12px;
  font-family: var(--font-body);
  font-size: 0.95rem;
  color: var(--text);
  background: var(--surface-alt);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  outline: none;
  transition: border-color 0.2s;
}
.field input:focus, .field select:focus, .field textarea:focus {
  border-color: var(--green);
}
.field textarea { resize: vertical; min-height: 80px; }

/* ── Allergen picker ── */
.allergen-picker { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.allergen-tag {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 14px;
  background: var(--saffron-soft); color: var(--saffron);
  font-size: 0.82rem; font-weight: 600;
}
.allergen-tag .a-remove {
  cursor: pointer; margin-left: 2px; font-size: 14px;
  color: var(--saffron); opacity: .6; line-height: 1;
}
.allergen-tag .a-remove:hover { opacity: 1; }
.allergen-add-wrap { position: relative; display: inline-block; }
.allergen-add-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 4px 12px; border-radius: 14px;
  background: var(--green-soft); color: var(--green);
  font-size: 0.82rem; font-weight: 600;
  border: 1px dashed var(--green); cursor: pointer;
}
.allergen-add-btn:hover { background: var(--green); color: #fff; }
.allergen-dropdown {
  display: none; position: absolute; left: 0; top: 100%;
  margin-top: 4px; z-index: 100;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); box-shadow: 0 4px 16px rgba(0,0,0,.12);
  max-height: 220px; overflow-y: auto; min-width: 220px;
}
.allergen-dropdown.show { display: block; }
.allergen-dropdown-item {
  padding: 8px 12px; cursor: pointer; font-size: 0.85rem;
  display: flex; align-items: center; gap: 6px;
}
.allergen-dropdown-item:hover { background: var(--surface-alt); }
.allergen-dropdown-item .a-icon { font-size: 16px; }
.field select { cursor: pointer; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 10px 20px;
  font-family: var(--font-body);
  font-size: 0.95rem;
  font-weight: 600;
  border: none;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}
.btn:active { transform: scale(0.97); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary {
  background: var(--green-deep);
  color: #fff;
}
.btn-primary:hover:not(:disabled) { opacity: 0.9; }

.btn-saffron {
  background: var(--saffron);
  color: #fff;
}
.btn-saffron:hover:not(:disabled) { opacity: 0.9; }

.btn-danger {
  background: var(--danger);
  color: #fff;
  padding: 6px 12px;
  font-size: 0.85rem;
}

.btn-outline {
  background: transparent;
  color: var(--text-secondary);
  border: 1px solid var(--border);
  padding: 6px 14px;
  font-size: 0.85rem;
}
.btn-outline:hover { border-color: var(--text-muted); }

.btn-block { width: 100%; }

.error-msg {
  color: var(--danger);
  font-size: 0.85rem;
  margin-top: 10px;
}

/* ══════════════════════════════════════
   DASHBOARD
   ══════════════════════════════════════ */
#dashboard { display: none; }

.topbar {
  background: var(--green-deep);
  color: #fff;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 100;
}
.topbar h2 {
  font-size: 1.15rem;
  font-weight: 600;
}
.topbar-links {
  display: flex;
  align-items: center;
  gap: 12px;
}
.topbar-links a {
  color: rgba(255,255,255,0.75);
  text-decoration: none;
  font-size: 0.82rem;
}
.topbar-links a:hover { color: #fff; }
.topbar .btn-logout {
  background: rgba(255,255,255,0.15);
  color: #fff;
  border: none;
  padding: 6px 14px;
  border-radius: var(--radius-sm);
  font-size: 0.82rem;
  font-family: var(--font-body);
  cursor: pointer;
}
.topbar .btn-logout:hover { background: rgba(255,255,255,0.25); }

/* Tabs */
.tabs {
  display: flex;
  gap: 0;
  overflow-x: auto;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 49px;
  z-index: 99;
  -webkit-overflow-scrolling: touch;
}
.tabs button {
  flex: 0 0 auto;
  padding: 10px 16px;
  font-family: var(--font-body);
  font-size: 0.85rem;
  font-weight: 500;
  color: var(--text-muted);
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  cursor: pointer;
  white-space: nowrap;
  transition: color 0.2s, border-color 0.2s;
}
.tabs button.active {
  color: var(--saffron);
  border-bottom-color: var(--saffron);
}
.tabs button:hover:not(.active) { color: var(--text); }

/* Section */
.section { padding: 16px 0 80px; }
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}
.section-header h3 {
  font-size: 1.3rem;
  color: var(--green-deep);
}
.section-meta {
  font-size: 0.78rem;
  color: var(--text-muted);
  margin-bottom: 14px;
}

/* Cards */
.item-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
  transition: box-shadow 0.2s;
}
.item-card:hover { box-shadow: 0 2px 12px var(--shadow); }

.item-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  cursor: pointer;
  gap: 10px;
}
.item-summary-text {
  flex: 1;
  min-width: 0;
}
.item-summary-text .item-title {
  font-weight: 600;
  font-size: 0.95rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item-summary-text .item-sub {
  font-size: 0.8rem;
  color: var(--text-muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.item-actions {
  display: flex;
  gap: 6px;
  flex-shrink: 0;
}
.item-actions button {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.1rem;
  padding: 4px;
  border-radius: 6px;
  transition: background 0.15s;
}
.item-actions button:hover { background: var(--border-light); }
.item-actions .btn-delete { color: var(--danger); }

.item-form {
  display: none;
  padding: 0 14px 14px;
  border-top: 1px solid var(--border-light);
}
.item-form.open { display: block; }

.item-form .form-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.item-form .form-grid .full { grid-column: 1 / -1; }

@media (max-width: 480px) {
  .item-form .form-grid { grid-template-columns: 1fr; }
}

/* Add new item area */
.add-card {
  background: var(--surface-alt);
  border: 2px dashed var(--border);
  border-radius: var(--radius);
  margin-bottom: 10px;
  overflow: hidden;
}
.add-card .item-form { display: block; padding: 14px; border-top: none; }
.add-card h4 {
  font-family: var(--font-display);
  font-size: 1.1rem;
  color: var(--green-deep);
  margin: 0 0 12px;
}

/* Save bar */
.save-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 12px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  z-index: 100;
  box-shadow: 0 -2px 12px var(--shadow);
}

/* Toast */
.toast-container {
  position: fixed;
  top: 60px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 1000;
  display: flex;
  flex-direction: column;
  gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--green-deep);
  color: #fff;
  padding: 10px 20px;
  border-radius: var(--radius-sm);
  font-size: 0.9rem;
  font-weight: 500;
  box-shadow: 0 4px 16px var(--shadow-md);
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.5s forwards;
  pointer-events: auto;
}
.toast.error { background: var(--danger); }
@keyframes toastIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
@keyframes toastOut { from { opacity: 1; } to { opacity: 0; } }

/* Loading spinner */
.spinner {
  display: inline-block;
  width: 18px;
  height: 18px;
  border: 2px solid var(--border);
  border-top-color: var(--saffron);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

.loading-overlay {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 40px;
  color: var(--text-muted);
  font-size: 0.9rem;
}

/* Empty state */
.empty-state {
  text-align: center;
  padding: 30px;
  color: var(--text-muted);
  font-size: 0.9rem;
}

/* Move items */
.item-card .move-btns {
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex-shrink: 0;
}
.move-btns button {
  background: none;
  border: none;
  cursor: pointer;
  font-size: 0.8rem;
  padding: 0 4px;
  color: var(--text-muted);
  line-height: 1;
}
.move-btns button:hover { color: var(--text); }

/* Sub-filter switch (horaires café/boutique) */
.sub-filter {
  display: flex; gap: 0; margin-bottom: 14px;
  background: var(--surface-alt); border-radius: var(--radius-sm);
  padding: 3px; border: 1px solid var(--border-light);
}
.sub-filter button {
  flex: 1; padding: 8px 14px; font-family: var(--font-body);
  font-size: 0.85rem; font-weight: 500; color: var(--text-muted);
  background: none; border: none; border-radius: 8px; cursor: pointer;
  transition: all 0.2s;
}
.sub-filter button.active {
  background: var(--surface); color: var(--green-deep);
  font-weight: 600; box-shadow: 0 1px 4px var(--shadow);
}

/* Group headers (day / category groups) */
.group-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; margin: 16px 0 8px;
  background: var(--pink-mist); border-radius: var(--radius-sm);
  font-family: var(--font-display); font-size: 1.05rem;
  font-weight: 600; color: var(--green-deep);
}
.group-header:first-child { margin-top: 0; }
.group-header .group-actions { display: flex; gap: 6px; }
.group-header .group-actions button {
  background: none; border: none; cursor: pointer; font-size: 0.85rem;
  padding: 4px 8px; border-radius: 6px; color: var(--text-muted);
  transition: background 0.15s;
}
.group-header .group-actions button:hover { background: var(--border-light); }

.group-add-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 6px 14px; font-family: var(--font-body);
  font-size: 0.82rem; font-weight: 500;
  color: var(--green); background: var(--green-soft);
  border: 1px dashed var(--green); border-radius: var(--radius-sm);
  cursor: pointer; margin: 4px 0 12px; width: 100%;
  justify-content: center;
}
.group-add-btn:hover { background: var(--green); color: #fff; }

/* Checkboxes végan / sans-gluten */
.regime-checks {
  display: flex; gap: 16px; flex-wrap: wrap; align-items: center;
}
.regime-check {
  display: inline-flex; align-items: center; gap: 6px;
  cursor: pointer; font-size: 0.85rem; color: var(--text-secondary);
  user-select: none;
}
.regime-check input[type="checkbox"] {
  width: 18px; height: 18px; accent-color: var(--green); cursor: pointer;
}

/* Preview button */
.btn-preview {
  background: transparent; color: var(--green-deep);
  border: 1px solid var(--green); padding: 10px 20px;
  font-family: var(--font-body); font-size: 0.95rem;
  font-weight: 600; border-radius: var(--radius-sm);
  cursor: pointer; transition: all 0.2s;
}
.btn-preview:hover { background: var(--green-soft); }

/* Preview overlay — app-faithful */
.preview-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,0.5); z-index: 200;
  align-items: flex-start; justify-content: center;
  padding: 16px 8px; overflow-y: auto;
}
.preview-overlay.show { display: flex; }
.preview-modal {
  background: var(--bg); border-radius: 20px;
  width: 100%; max-width: 400px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.25);
  overflow: hidden; border: 2px solid var(--border);
}
.preview-modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 16px;
  background: var(--green-deep); color: #fff;
}
.preview-modal-head h3 { font-size: 1rem; color: #fff; font-family: var(--font-display); }
.preview-modal-close {
  background: rgba(255,255,255,.15); border: none; font-size: 1.1rem;
  cursor: pointer; color: #fff; padding: 4px 10px; border-radius: 6px;
}
.preview-modal-body { padding: 0; background: var(--bg); }

/* ── App-faithful preview styles ── */
.pv-section-head {
  padding: 16px 18px 12px;
  border-bottom: 1px solid var(--border-light);
}
.pv-section-head h2 {
  font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--text);
}
.pv-day-strip {
  display: flex; gap: 6px; padding: 10px 14px 6px; overflow-x: auto;
  scrollbar-width: none;
}
.pv-day-strip::-webkit-scrollbar { display: none; }
.pv-day-pill {
  flex-shrink: 0; padding: 6px 14px; border-radius: 20px;
  font-size: 12px; font-weight: 600;
  background: var(--surface); color: var(--text-secondary);
  border: 1px solid var(--border); cursor: pointer; white-space: nowrap;
  transition: all 0.2s;
}
.pv-day-pill.active { background: var(--pink); color: #fff; border-color: var(--pink); }
/* Timeline */
.pv-timeline { padding: 4px 14px 14px 20px; }
.pv-tl-event { display: flex; gap: 12px; position: relative; }
.pv-tl-event:last-child .pv-tl-line { display: none; }
.pv-tl-spine { display: flex; flex-direction: column; align-items: center; width: 12px; flex-shrink: 0; padding-top: 6px; }
.pv-tl-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--border); flex-shrink: 0; z-index: 1; }
.pv-tl-dot.meditation { background: var(--green); }
.pv-tl-dot.teaching { background: var(--green-deep); }
.pv-tl-dot.ceremony { background: var(--pink); }
.pv-tl-dot.meal { background: var(--gold); }
.pv-tl-dot.practical { background: var(--text-muted); }
.pv-tl-line { width: 1.5px; flex: 1; background: var(--border-light); margin: 3px 0; }
.pv-tl-card {
  flex: 1; background: var(--surface); border: 1px solid var(--border-light);
  border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px;
  box-shadow: 0 1px 3px var(--shadow);
}
.pv-tl-card.ceremony { border-left: 3px solid var(--pink); background: var(--pink-soft); }
.pv-tl-time { font-size: 11px; font-weight: 600; color: var(--text-muted); letter-spacing: 0.03em; }
.pv-tl-title { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.3; margin-top: 1px; }
.pv-tl-desc { font-size: 12px; color: var(--text-secondary); margin-top: 2px; line-height: 1.4; }
.pv-tl-badge { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 2px 8px; border-radius: 8px; margin-top: 4px; background: var(--pink-soft); color: var(--pink); }
/* Cards */
.pv-card {
  background: var(--surface); border: 1px solid var(--border-light);
  border-radius: var(--radius); padding: 16px; margin: 0 12px 12px;
  box-shadow: 0 2px 6px var(--shadow);
}
.pv-card-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.pv-card-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }

      0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,

      var w=[];for(var i=0;i<16;i++)w[i]=(bytes[off+i*4]<<24)|(bytes[off+i*4+1]<<16)|(bytes[off+i*4+2]<<8)|bytes[off+i*4+3];
      for(var i=16;i<64;i++){var s0=rightRotate(w[i-15],7)^rightRotate(w[i-15],18)^(w[i-15]>>>3);var s1=rightRotate(w[i-2],17)^rightRotate(w[i-2],19)^(w[i-2]>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0;}
      var a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
      for(var i=0;i<64;i++){var S1=rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25);var ch=(e&f)^(~e&g);var t1=(h+S1+ch+K[i]+w[i])|0;var S0=rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22);var maj=(a&b)^(a&c)^(b&c);var t2=(S0+maj)|0;h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0;}
      H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
    }
    return H.map(function(v){return('00000000'+(v>>>0).toString(16)).slice(-8);}).join('');
  }
  return sha256Fallback(str);
}

function fbUrl(path) {
  return `${CONFIG.FIREBASE_URL}/${path}`;
}

async function fbGet(path) {
  const res = await fetch(fbUrl(path));
  if (!res.ok) throw new Error(`Firebase GET erreur: ${res.status}`);
  return res.json();
}

async function fbPut(path, body) {
  const res = await fetch(fbUrl(path), {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  if (!res.ok) throw new Error(`Firebase PUT erreur: ${res.status}`);
  return res.json();
}

function toast(msg, isError) {
  const el = document.createElement('div');
  el.className = 'toast' + (isError ? ' error' : '');
  el.textContent = msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(() => el.remove(), 3000);
}

function setLoading(btnId, loading) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  btn.disabled = loading;
  if (loading) {
    btn.dataset.origText = btn.textContent;
    btn.innerHTML = '<span class="spinner"></span>';
  } else {
    btn.textContent = btn.dataset.origText || '';
  }
}

/* ══════════════════════════════════════
   AUTH
   ══════════════════════════════════════ */
async function initAuth() {
  // Check sessionStorage first
  try {
    if (sessionStorage.getItem('cd2026_admin') === 'true') {
      showDashboard();
      return;
    }
  } catch(e) {}

  // Check if password hash exists in Firebase
  try {
    const hash = await fbGet('config/passwordHash.json');
    document.getElementById('login-loading').style.display = 'none';
    if (hash) {
      document.getElementById('login-form').style.display = 'block';
    } else {
      document.getElementById('setup-form').style.display = 'block';
    }
  } catch(e) {
    document.getElementById('login-loading').style.display = 'none';
    // If Firebase is not configured, show a helpful message
    document.getElementById('setup-form').style.display = 'block';
    if (!CONFIG.FIREBASE_URL) {
      document.getElementById('setup-error').textContent = 'Veuillez configurer FIREBASE_URL dans le fichier admin.html.';
      document.getElementById('setup-error').style.display = 'block';
      document.getElementById('setup-btn').disabled = true;
    }
  }
}

async function handleSetup() {
  const pw = document.getElementById('setup-pw').value;
  const pw2 = document.getElementById('setup-pw2').value;
  const errEl = document.getElementById('setup-error');

  if (pw !== pw2) {
    errEl.textContent = 'Les mots de passe ne correspondent pas.';
    errEl.style.display = 'block';
    return false;
  }
  if (pw.length < 4) {
    errEl.textContent = 'Le mot de passe doit faire au moins 4 caracteres.';
    errEl.style.display = 'block';
    return false;
  }

  errEl.style.display = 'none';
  setLoading('setup-btn', true);

  try {
    const hash = await sha256(pw);
    await fbPut('config/passwordHash.json', hash);
    try { sessionStorage.setItem('cd2026_admin', 'true'); } catch(e) {}
    showDashboard();
  } catch(e) {
    errEl.textContent = 'Erreur de connexion a Firebase. Verifiez la configuration.';
    errEl.style.display = 'block';
    setLoading('setup-btn', false);
  }
  return false;
}

async function handleLogin() {
  const pw = document.getElementById('login-pw').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  setLoading('login-btn', true);

  try {
    const storedHash = await fbGet('config/passwordHash.json');
    const inputHash = await sha256(pw);
    if (inputHash === storedHash) {
      try { sessionStorage.setItem('cd2026_admin', 'true'); } catch(e) {}
      showDashboard();
    } else {
      errEl.textContent = 'Mot de passe incorrect.';
      errEl.style.display = 'block';
      setLoading('login-btn', false);
    }
  } catch(e) {
    errEl.textContent = 'Erreur de connexion.';
    errEl.style.display = 'block';
    setLoading('login-btn', false);
  }
  return false;
}

function logout() {
  try { sessionStorage.removeItem('cd2026_admin'); } catch(e) {}
  location.reload();
}

/* ══════════════════════════════════════
   DASHBOARD
   ══════════════════════════════════════ */
async function showDashboard() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  buildTabs();
  await loadData();
}

function buildTabs() {
  const bar = document.getElementById('tab-bar');
  bar.innerHTML = '';
  for (const [key, section] of Object.entries(SECTIONS)) {
    const btn = document.createElement('button');
    btn.textContent = section.label;
    btn.className = key === currentTab ? 'active' : '';
    btn.onclick = () => switchTab(key);
    bar.appendChild(btn);
  }
  // Analytics tab
  const aBtn = document.createElement('button');
  aBtn.textContent = '📊 Analytics';
  aBtn.className = currentTab === '__analytics__' ? 'active' : '';
  aBtn.onclick = () => switchTab('__analytics__');
  bar.appendChild(aBtn);
}

function switchTab(key) {
  currentTab = key;
  const sectionKeys = Object.keys(SECTIONS);
  document.querySelectorAll('.tabs button').forEach((btn, i) => {
    if (i < sectionKeys.length) {
      btn.className = sectionKeys[i] === key ? 'active' : '';
    } else {
      btn.className = key === '__analytics__' ? 'active' : '';
    }
  });
  if (key === '__analytics__') {
    renderAnalytics();
    document.getElementById('save-btn').style.display = 'none';
    document.getElementById('preview-btn').style.display = 'none';
  } else {
    document.getElementById('save-btn').style.display = '';
    document.getElementById('preview-btn').style.display = '';
    renderSection();
  }
}

async function loadData() {
  const content = document.getElementById('section-content');
  content.innerHTML = '<div class="loading-overlay"><span class="spinner"></span> Chargement des donnees...</div>';

  try {
    // Load data and config in parallel
    const [result, configResult] = await Promise.all([
      fbGet('data.json'),
      fbGet('config.json').catch(() => null),
    ]);
    data = result || {};

    // Load dynamic config
    if (configResult) {
      if (Array.isArray(configResult.jourOptions) && configResult.jourOptions.length) {
        JOUR_OPTIONS = configResult.jourOptions;
      }
      if (Array.isArray(configResult.serviceTypes) && configResult.serviceTypes.length) {
        SERVICE_TYPES = configResult.serviceTypes;
      }
      if (configResult.cafeVisible !== undefined) {
        cafeVisible = configResult.cafeVisible !== false;
      }
      if (configResult.disabledServices && typeof configResult.disabledServices === 'object') {
        disabledServices = configResult.disabledServices;
      }
    }
    // Rebuild sections with loaded config
    SECTIONS = buildSections();

    // Ensure each section is an array
    for (const key of Object.keys(SECTIONS)) {
      if (!Array.isArray(data[key])) {
        data[key] = data[key] ? Object.values(data[key]) : [];
      }
    }
    renderSection();
  } catch(e) {
    content.innerHTML = '<div class="empty-state">Erreur de chargement. Verifiez la connexion Firebase.</div>';
  }
}

/* ══════════════════════════════════════
   RENDER
   ══════════════════════════════════════ */
function renderSection() {
  const key = currentTab;
  const schema = SECTIONS[key];
  let items = data[key] || [];
  const content = document.getElementById('section-content');

  if (!expandedItems[key]) expandedItems[key] = new Set();

  let html = '<div class="section">';

  // Section header
  const useGroupedAdd = (key === 'cafe' || key === 'horaires' || key === 'repas');
  html += `<div class="section-header">
    <h3>${schema.label}</h3>
    ${!useGroupedAdd ? `<button class="btn btn-outline" onclick="toggleAdd('${key}')" id="add-toggle-${key}">
      ${addingNew[key] ? 'Annuler' : '+ Ajouter'}
    </button>` : ''}
  </div>`;

  if (lastSaved[key]) {
    html += `<div class="section-meta">Derniere sauvegarde : ${lastSaved[key]}</div>`;
  }

  // ── Date manager (for sections with hasDates) ──
  if (schema.hasDates) {
    html += renderDateManager();
  }

  // ── Service type manager (for repas) ──
  if (schema.hasServiceTypes) {
    html += renderServiceTypeManager();
  }

  // ── Café visibility toggle ──
  if (key === 'cafe') {
    html += `<div class="cafe-visibility-toggle">
      <label>
        <input type="checkbox" ${cafeVisible ? 'checked' : ''}
          onchange="toggleCafeVisibility(this.checked)">
        Afficher la carte sur l'application
      </label>
      <span style="font-size:0.78rem;color:var(--text-muted);margin-left:auto;">
        ${cafeVisible ? '✅ Visible' : '🚫 Masquée'}
      </span>
    </div>`;
  }

  // ── Horaires: café/boutique sub-filter ──
  if (key === 'horaires') {
    html += `<div class="sub-filter">
      <button class="${horaireFilter==='cafe'?'active':''}" onclick="setHoraireFilter('cafe')">☕ World Peace Café</button>
      <button class="${horaireFilter==='shop'?'active':''}" onclick="setHoraireFilter('shop')">🛍 Boutique</button>
    </div>`;
    items = items.filter(it => (it.lieu || 'cafe') === horaireFilter);
  }

  // ── Global "add new" form (for non-grouped sections) ──
  if (addingNew[key] && !useGroupedAdd) {
    html += `<div class="add-card">
      <div class="item-form">
        <h4>Nouvel element</h4>
        <div class="form-grid">${renderFields(schema.fields, {}, key, 'new')}</div>
        <div style="margin-top:12px; display:flex; gap:8px;">
          <button class="btn btn-primary" onclick="addItem('${key}')">Ajouter</button>
          <button class="btn btn-outline" onclick="toggleAdd('${key}')">Annuler</button>
        </div>
      </div>
    </div>`;
  }

  // ── Determine if we group items ──
  const grouped = (key === 'programme' || key === 'repas' || key === 'cafe' || key === 'horaires');

  if (grouped) {
    html += renderGroupedItems(key, schema, items);
  } else {
    if (items.length === 0 && !addingNew[key]) {
      html += '<div class="empty-state">Aucun element. Cliquez sur "+ Ajouter" pour commencer.</div>';
    }
    const allItems = data[key] || [];
    allItems.forEach((item, idx) => {
      html += renderItemCard(key, schema, item, idx, allItems.length);
    });
  }

  html += '</div>';
  content.innerHTML = html;
}

/* ── Grouped items rendering ── */
function renderGroupedItems(key, schema, displayItems) {
  let html = '';
  const allItems = data[key] || [];

  if (key === 'programme' || key === 'repas') {
    // Group by jour
    const dayOrder = JOUR_OPTIONS.map(j => j.value);
    const groups = {};
    displayItems.forEach((item, _) => {
      const realIdx = allItems.indexOf(item);
      const day = item.jour || '';
      if (!groups[day]) groups[day] = [];
      groups[day].push({ item, realIdx });
    });

    // Sort days
    const sortedDays = Object.keys(groups).sort((a, b) => {
      const ia = dayOrder.indexOf(a), ib = dayOrder.indexOf(b);
      return (ia === -1 ? 999 : ia) - (ib === -1 ? 999 : ib);
    });

    if (key === 'repas') {
      // Show ALL days × ALL service types by default
      const allDays = dayOrder; // all configured days, not just those with data
      const daysToRender = allDays.length ? allDays : sortedDays;

      for (const day of daysToRender) {
        const dayLabel = (JOUR_OPTIONS.find(j => j.value === day) || {}).label || day || 'Non défini';
        html += `<div class="group-header">${escHtml(dayLabel)}</div>`;

        // Build service groups from existing items for this day
        const svcGroups = {};
        if (groups[day]) {
          groups[day].forEach(entry => {
            const svc = entry.item.service_fr || 'Autre';
            if (!svcGroups[svc]) svcGroups[svc] = [];
            svcGroups[svc].push(entry);
          });
        }

        // Show ALL service types (from SERVICE_TYPES), even if no dishes yet
        const dayDisabled = disabledServices[day] || [];
        for (const st of SERVICE_TYPES) {
          const svcFr = st.value_fr;
          const isDisabled = dayDisabled.includes(svcFr);
          const dayEsc = escAttr(day);
          const svcEsc = escAttr(svcFr);

          html += `<div class="repas-svc-header${isDisabled ? ' disabled' : ''}">
            <input type="checkbox" class="repas-svc-toggle" ${!isDisabled ? 'checked' : ''}
              onchange="toggleRepasService('${dayEsc}','${svcEsc}',this.checked)" title="${isDisabled ? 'Activer' : 'Désactiver'} ${escHtml(svcFr)}">
            <span>${escHtml(svcFr)}</span>
            ${!isDisabled ? `<button class="repas-svc-add" onclick="startRepasServiceAdd('${dayEsc}','${svcEsc}')">+ Plat</button>` : ''}
          </div>`;

          if (!isDisabled) {
            const entries = svcGroups[svcFr] || [];
            if (entries.length === 0 && !(addingNewGroup['repas'] === day + '|' + svcFr)) {
              html += `<div class="repas-svc-empty">Aucun plat — cliquez "+ Plat" pour ajouter</div>`;
            }
            for (const entry of entries) {
              html += renderItemCard(key, schema, entry.item, entry.realIdx, allItems.length);
            }
            // Inline add form for this day+service
            if (addingNewGroup['repas'] === day + '|' + svcFr) {
              const svcEn = st.value_en || '';
              const prefilled = { jour: day, service_fr: svcFr, service_en: svcEn };
              html += `<div class="add-card">
                <div class="item-form">
                  <h4>Nouveau plat — ${escHtml(svcFr)}</h4>
                  <div class="form-grid">${renderFields(schema.fields, prefilled, key, 'new', true)}</div>
                  <div style="margin-top:12px; display:flex; gap:8px;">
                    <button class="btn btn-primary" onclick="addItem('repas')">Ajouter</button>
                    <button class="btn btn-outline" onclick="cancelGroupAdd('repas')">Annuler</button>
                  </div>
                </div>
              </div>`;
            }
          }
        }

        // Also show any service entries that don't match SERVICE_TYPES (legacy/custom)
        const knownSvcs = SERVICE_TYPES.map(s => s.value_fr);
        const extraSvcs = Object.keys(svcGroups).filter(s => !knownSvcs.includes(s));
        for (const svc of extraSvcs) {
          html += `<div class="repas-svc-header"><span>${escHtml(svc)}</span></div>`;
          for (const entry of svcGroups[svc]) {
            html += renderItemCard(key, schema, entry.item, entry.realIdx, allItems.length);
          }
        }
      }
    } else {
      // Programme: just group by day
      for (const day of sortedDays) {
        const dayLabel = (JOUR_OPTIONS.find(j => j.value === day) || {}).label || day || 'Non défini';
        html += `<div class="group-header">${escHtml(dayLabel)}</div>`;
        for (const entry of groups[day]) {
          html += renderItemCard(key, schema, entry.item, entry.realIdx, allItems.length);
        }
      }
    }

    if (displayItems.length === 0 && key !== 'repas') {
      html += '<div class="empty-state">Aucun element. Cliquez sur "+ Ajouter" pour commencer.</div>';
    }

  } else if (key === 'cafe') {
    // Group by categorie_fr
    const categories = [];
    const catMap = {};
    allItems.forEach((item, idx) => {
      const cat = item.categorie_fr || 'Sans catégorie';
      if (!catMap[cat]) { catMap[cat] = []; categories.push(cat); }
      catMap[cat].push({ item, realIdx: idx });
    });

    if (categories.length === 0 && !addingNewGroup[key]) {
      html += '<div class="empty-state">Aucun element.</div>';
    }

    for (const cat of categories) {
      const catEsc = escAttr(cat);
      html += `<div class="group-header">
        <span>${escHtml(cat)}</span>
        <div class="group-actions">
          <button onclick="renameCategoryPrompt('${catEsc}')" title="Renommer">&#9998;</button>
          <button onclick="deleteCategory('${catEsc}')" title="Supprimer catégorie" style="color:var(--danger);">&#128465;</button>
        </div>
      </div>`;

      for (const entry of catMap[cat]) {
        html += renderItemCard(key, schema, entry.item, entry.realIdx, allItems.length);
      }

      // Add within category button — hide category fields
      if (addingNewGroup[key] === cat) {
        const prefilled = { categorie_fr: cat };
        const match = (data[key]||[]).find(it => it.categorie_fr === cat);
        if (match) prefilled.categorie_en = match.categorie_en || '';
        html += `<div class="add-card">
          <div class="item-form">
            <h4>Nouvel element — ${escHtml(cat)}</h4>
            <div class="form-grid">${renderFields(schema.fields, prefilled, key, 'new', true)}</div>
            <div style="margin-top:12px; display:flex; gap:8px;">
              <button class="btn btn-primary" onclick="addItem('${key}')">Ajouter</button>
              <button class="btn btn-outline" onclick="cancelGroupAdd('${key}')">Annuler</button>
            </div>
          </div>
        </div>`;
      } else {
        html += `<button class="group-add-btn" onclick="startGroupAdd('cafe', '${catEsc}')">+ Ajouter dans ${escHtml(cat)}</button>`;
      }
    }

    // Add new category
    html += `<div style="margin-top:16px; border-top: 1px dashed var(--border); padding-top: 14px;">
      <button class="btn btn-outline" onclick="addCategoryPrompt()" style="width:100%;">+ Nouvelle catégorie</button>
    </div>`;

  } else if (key === 'horaires') {
    // Horaires — items already filtered by lieu. Group by jour_fr
    const dayGroups = {};
    const dayOrder = [];
    displayItems.forEach(item => {
      const realIdx = allItems.indexOf(item);
      const day = item.jour_fr || 'Non défini';
      if (!dayGroups[day]) { dayGroups[day] = []; dayOrder.push(day); }
      dayGroups[day].push({ item, realIdx });
    });

    for (const day of dayOrder) {
      const dayEsc = escAttr(day);
      html += `<div class="group-header">
        <span>${escHtml(day)}</span>
        <div class="group-actions">
          <button onclick="duplicateHoraireDay('${dayEsc}')" title="Dupliquer sur tous les jours">📋 Dupliquer</button>
        </div>
      </div>`;
      for (const entry of dayGroups[day]) {
        html += renderItemCard(key, schema, entry.item, entry.realIdx, allItems.length);
      }
    }

    // Add within current filter
    if (addingNew[key]) {
      html += `<div class="add-card">
        <div class="item-form">
          <h4>Nouvel horaire — ${horaireFilter === 'cafe' ? 'Café' : 'Boutique'}</h4>
          <div class="form-grid">${renderFields(schema.fields, { lieu: horaireFilter }, key, 'new')}</div>
          <div style="margin-top:12px; display:flex; gap:8px;">
            <button class="btn btn-primary" onclick="addItem('${key}')">Ajouter</button>
            <button class="btn btn-outline" onclick="toggleAdd('${key}')">Annuler</button>
          </div>
        </div>
      </div>`;
    } else {
      html += `<button class="group-add-btn" onclick="toggleAdd('horaires')">+ Ajouter un horaire</button>`;
    }

    if (displayItems.length === 0 && !addingNew[key]) {
      html += `<div class="empty-state">Aucun horaire pour ${horaireFilter === 'cafe' ? 'le café' : 'la boutique'}.</div>`;
    }
  }

  return html;
}

/* ── Single item card (move buttons RIGHT of delete) ── */
function renderItemCard(key, schema, item, idx, totalCount) {
  const isOpen = expandedItems[key].has(idx);
  const title = item[schema.titleField] || '(sans titre)';
  const sub = typeof schema.subField === 'function' ? schema.subField(item) : '';

  // Regime badges
  let badges = '';
  if (item.vegan === true || item.vegan === 'true') badges += ' <span class="pv-badge pv-vegan">🌱</span>';
  if (item.sans_gluten === true || item.sans_gluten === 'true') badges += ' <span class="pv-badge pv-gf">GF</span>';

  return `<div class="item-card">
    <div class="item-summary">
      <div class="item-summary-text" onclick="toggleItem('${key}', ${idx})">
        <div class="item-title">${escHtml(title)}${badges}</div>
        <div class="item-sub">${escHtml(sub)}</div>
      </div>
      <div class="item-actions">
        <button onclick="toggleItem('${key}', ${idx})" title="${isOpen ? 'Fermer' : 'Editer'}">${isOpen ? '&#9650;' : '&#9998;'}</button>
        <button class="btn-delete" onclick="deleteItem('${key}', ${idx})" title="Supprimer">&#128465;</button>
      </div>
      <div class="move-btns">
        <button onclick="event.stopPropagation(); moveItem('${key}', ${idx}, -1)" title="Monter" ${idx===0?'disabled':''}>&#9650;</button>
        <button onclick="event.stopPropagation(); moveItem('${key}', ${idx}, 1)" title="Descendre" ${idx===totalCount-1?'disabled':''}>&#9660;</button>
      </div>
    </div>
    <div class="item-form ${isOpen ? 'open' : ''}" id="form-${key}-${idx}">
      <div class="form-grid">${renderFields(schema.fields, item, key, idx)}</div>
    </div>
  </div>`;
}

function renderFields(fields, item, sectionKey, idx, hideCategories) {
  return fields.map(f => {
    const val = item[f.key] !== undefined ? item[f.key] : (f.default || '');
    const inputId = `field-${sectionKey}-${idx}-${f.key}`;
    const fullClass = f.full ? ' full' : '';
    let input;

    // Hide category fields when adding within a category group
    if (hideCategories && (f.key === 'categorie_fr' || f.key === 'categorie_en'
        || f.key === 'jour' || f.key === 'service_fr' || f.key === 'service_en')) {
      return `<input type="hidden" id="${inputId}" value="${escAttr(val)}">`;
    }

    // For repas service_en: auto-fill from service_fr when it's a known service type
    if (sectionKey === 'repas' && f.key === 'service_en') {
      const svcFr = item.service_fr || '';
      const match = SERVICE_TYPES.find(s => s.value_fr === svcFr);
      const autoVal = match ? match.value_en : val;
      if (match && idx === 'new') {
        // Auto-set via updateField
        setTimeout(() => updateField(sectionKey, idx, 'service_en', autoVal), 0);
      }
      input = `<input type="text" id="${inputId}" value="${escAttr(autoVal)}" placeholder="${f.placeholder||''}"
        oninput="updateField('${sectionKey}', '${idx}', '${f.key}', this.value)">`;
      return `<div class="field${fullClass}">
        <label for="${inputId}">${f.label}</label>
        ${input}
      </div>`;
    }

    if (f.type === 'checkbox') {
      const checked = val === true || val === 'true';
      input = `<label class="regime-check">
        <input type="checkbox" id="${inputId}" ${checked ? 'checked' : ''}
          onchange="updateField('${sectionKey}', '${idx}', '${f.key}', this.checked)">
        ${f.label}
      </label>`;
      return `<div class="field">${input}</div>`;
    } else if (f.type === 'allergen-picker') {
      const codes = String(val||'').split(',').map(x=>x.trim()).filter(Boolean);
      const tags = codes.map(c => {
        const a = ALLERGEN_LIST.find(x=>x.code===c);
        const lbl = a ? a.icon + ' ' + a.label : c;
        return `<span class="allergen-tag">${lbl}<span class="a-remove" onclick="removeAllergen('${sectionKey}','${idx}','${f.key}','${c}')">&times;</span></span>`;
      }).join('');
      const pickerId = `ap-${sectionKey}-${idx}`;
      input = `<div class="allergen-picker" id="${inputId}-tags">${tags}` +
        `<div class="allergen-add-wrap"><button type="button" class="allergen-add-btn" onclick="toggleAllergenDrop('${pickerId}')">+ Ajouter</button>` +
        `<div class="allergen-dropdown" id="${pickerId}">` +
        ALLERGEN_LIST.filter(a=>!codes.includes(a.code)).map(a =>
          `<div class="allergen-dropdown-item" onclick="addAllergen('${sectionKey}','${idx}','${f.key}','${a.code}','${pickerId}')"><span class="a-icon">${a.icon}</span> ${a.label}</div>`
        ).join('') +
        (ALLERGEN_LIST.filter(a=>!codes.includes(a.code)).length === 0 ? '<div style="padding:10px;color:var(--text-muted);font-size:0.85rem;">Tous ajoutés</div>' : '') +
        `</div></div></div>`;
    } else if (f.type === 'select') {
      const opts = (typeof f.options === 'function' ? f.options() : f.options).map(o =>
        `<option value="${o.value}" ${String(val) === String(o.value) ? 'selected' : ''}>${o.label}</option>`
      ).join('');
      // For service_fr in repas: auto-fill service_en on change
      const extraOnChange = (sectionKey === 'repas' && f.key === 'service_fr')
        ? `autoFillServiceEn('${idx}', this.value);` : '';
      input = `<select id="${inputId}" onchange="updateField('${sectionKey}', '${idx}', '${f.key}', this.value); ${extraOnChange}">
        <option value="">—</option>${opts}</select>`;
    } else if (f.type === 'textarea') {
      input = `<textarea id="${inputId}" rows="3" placeholder="${f.placeholder||''}"
        oninput="updateField('${sectionKey}', '${idx}', '${f.key}', this.value)">${escHtml(val)}</textarea>`;
    } else {
      input = `<input type="text" id="${inputId}" value="${escAttr(val)}" placeholder="${f.placeholder||''}"
        oninput="updateField('${sectionKey}', '${idx}', '${f.key}', this.value)">`;
    }

    return `<div class="field${fullClass}">
      <label for="${inputId}">${f.label}</label>
      ${input}
    </div>`;
  }).join('');
}

/* Auto-fill service_en when selecting service_fr */
function autoFillServiceEn(idx, valueFr) {
  const match = SERVICE_TYPES.find(s => s.value_fr === valueFr);
  if (match) {
    updateField('repas', idx, 'service_en', match.value_en);
    const enInput = document.getElementById(`field-repas-${idx}-service_en`);
    if (enInput) enInput.value = match.value_en;
  }
}

function escHtml(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function escAttr(s) { return String(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

/* ── Allergen picker helpers ── */
function toggleAllergenDrop(pickerId) {
  const dd = document.getElementById(pickerId);
  if (!dd) return;
  const show = !dd.classList.contains('show');
  // Close all dropdowns first
  document.querySelectorAll('.allergen-dropdown.show').forEach(el => el.classList.remove('show'));
  if (show) dd.classList.add('show');
}

function addAllergen(sectionKey, idx, fieldKey, code, pickerId) {
  const current = getAllergenCodes(sectionKey, idx, fieldKey);
  if (!current.includes(code)) current.push(code);
  updateField(sectionKey, idx, fieldKey, current.join(','));
  document.querySelectorAll('.allergen-dropdown.show').forEach(el => el.classList.remove('show'));
  renderSection();
}

function removeAllergen(sectionKey, idx, fieldKey, code) {
  const current = getAllergenCodes(sectionKey, idx, fieldKey).filter(c => c !== code);
  updateField(sectionKey, idx, fieldKey, current.join(','));
  renderSection();
}

function getAllergenCodes(sectionKey, idx, fieldKey) {
  let item;
  if (idx === 'new') {
    item = (data._new && data._new[sectionKey]) || {};
  } else {
    item = (data[sectionKey] || [])[parseInt(idx)] || {};
  }
  return String(item[fieldKey] || '').split(',').map(x=>x.trim()).filter(Boolean);
}

// Close dropdown when clicking outside
document.addEventListener('click', function(e) {
  if (!e.target.closest('.allergen-add-wrap')) {
    document.querySelectorAll('.allergen-dropdown.show').forEach(el => el.classList.remove('show'));
  }
});

/* ══════════════════════════════════════
   ACTIONS
   ══════════════════════════════════════ */
function toggleAdd(key) {
  addingNew[key] = !addingNew[key];
  renderSection();
}

function toggleItem(key, idx) {
  if (!expandedItems[key]) expandedItems[key] = new Set();
  if (expandedItems[key].has(idx)) {
    expandedItems[key].delete(idx);
  } else {
    expandedItems[key].add(idx);
  }
  renderSection();
}

function updateField(sectionKey, idx, fieldKey, value) {
  if (idx === 'new') {
    // Store in a temp object
    if (!data._new) data._new = {};
    if (!data._new[sectionKey]) data._new[sectionKey] = {};
    data._new[sectionKey][fieldKey] = value;
  } else {
    const i = parseInt(idx);
    if (!data[sectionKey]) data[sectionKey] = [];
    if (!data[sectionKey][i]) data[sectionKey][i] = {};
    data[sectionKey][i][fieldKey] = value;
  }
}

function addItem(sectionKey) {
  const schema = SECTIONS[sectionKey];
  const newItem = {};
  // Collect values from the "new" temp store
  const temp = (data._new && data._new[sectionKey]) || {};
  schema.fields.forEach(f => {
    newItem[f.key] = temp[f.key] !== undefined ? temp[f.key] : (f.default || '');
  });

  // For horaires, pre-fill lieu from filter
  if (sectionKey === 'horaires' && !newItem.lieu) {
    newItem.lieu = horaireFilter;
  }

  if (!data[sectionKey]) data[sectionKey] = [];

  // For café grouped add, insert after last item in that category
  if (sectionKey === 'cafe' && addingNewGroup[sectionKey]) {
    const cat = addingNewGroup[sectionKey];
    let insertIdx = -1;
    for (let i = data[sectionKey].length - 1; i >= 0; i--) {
      if (data[sectionKey][i].categorie_fr === cat) { insertIdx = i + 1; break; }
    }
    if (insertIdx === -1) insertIdx = data[sectionKey].length;
    data[sectionKey].splice(insertIdx, 0, newItem);
    delete addingNewGroup[sectionKey];
  } else if (sectionKey === 'repas' && addingNewGroup[sectionKey]) {
    // Insert after last item with matching day+service
    const [day, svcFr] = addingNewGroup[sectionKey].split('|');
    newItem.jour = day;
    newItem.service_fr = svcFr;
    const svcMatch = SERVICE_TYPES.find(s => s.value_fr === svcFr);
    if (svcMatch) newItem.service_en = svcMatch.value_en || '';
    let insertIdx = -1;
    for (let i = data[sectionKey].length - 1; i >= 0; i--) {
      if (data[sectionKey][i].jour === day && data[sectionKey][i].service_fr === svcFr) { insertIdx = i + 1; break; }
    }
    if (insertIdx === -1) insertIdx = data[sectionKey].length;
    data[sectionKey].splice(insertIdx, 0, newItem);
    delete addingNewGroup[sectionKey];
  } else {
    data[sectionKey].unshift(newItem);
  }

  addingNew[sectionKey] = false;
  if (data._new) delete data._new[sectionKey];

  // Reset expanded indices (simpler than adjusting after insert)
  expandedItems[sectionKey] = new Set();

  renderSection();
  toast('Element ajoute (pensez a sauvegarder)');
}

function deleteItem(sectionKey, idx) {
  const item = data[sectionKey][idx];
  const title = item[SECTIONS[sectionKey].titleField] || '(sans titre)';
  if (!confirm(`Supprimer "${title}" ?`)) return;

  data[sectionKey].splice(idx, 1);

  // Adjust expanded indices
  if (expandedItems[sectionKey]) {
    const adjusted = new Set();
    expandedItems[sectionKey].forEach(i => {
      if (i < idx) adjusted.add(i);
      else if (i > idx) adjusted.add(i - 1);
    });
    expandedItems[sectionKey] = adjusted;
  }

  renderSection();
  toast('Element supprime (pensez a sauvegarder)');
}

/* ── Horaire filter ── */
function setHoraireFilter(val) {
  horaireFilter = val;
  renderSection();
}

/* ── Grouped add (café categories) ── */
function startGroupAdd(sectionKey, groupVal) {
  addingNewGroup[sectionKey] = groupVal;
  // Pre-fill category
  if (!data._new) data._new = {};
  if (!data._new[sectionKey]) data._new[sectionKey] = {};
  data._new[sectionKey].categorie_fr = groupVal;
  // Find matching en category from existing items
  const match = (data[sectionKey]||[]).find(it => it.categorie_fr === groupVal);
  if (match) data._new[sectionKey].categorie_en = match.categorie_en || '';
  renderSection();
}

function cancelGroupAdd(sectionKey) {
  delete addingNewGroup[sectionKey];
  if (data._new) delete data._new[sectionKey];
  renderSection();
}

/* ── Repas: add dish within a day+service ── */
function startRepasServiceAdd(day, svcFr) {
  addingNewGroup['repas'] = day + '|' + svcFr;
  if (!data._new) data._new = {};
  data._new['repas'] = { jour: day, service_fr: svcFr };
  // Auto-fill service_en from SERVICE_TYPES
  const match = SERVICE_TYPES.find(s => s.value_fr === svcFr);
  if (match) data._new['repas'].service_en = match.value_en || '';
  renderSection();
}

/* ── Repas: toggle service per day ── */
function toggleRepasService(day, svcFr, enabled) {
  if (!disabledServices[day]) disabledServices[day] = [];
  if (enabled) {
    disabledServices[day] = disabledServices[day].filter(s => s !== svcFr);
    if (disabledServices[day].length === 0) delete disabledServices[day];
  } else {
    if (!disabledServices[day].includes(svcFr)) disabledServices[day].push(svcFr);
  }
  renderSection();
  toast(enabled ? `${svcFr} activé pour ce jour` : `${svcFr} masqué pour ce jour (pensez à sauvegarder)`);
}

/* ── Category management (café) ── */
function addCategoryPrompt() {
  const name = prompt('Nom de la nouvelle catégorie (FR) :');
  if (!name || !name.trim()) return;
  const nameEn = prompt('Nom en anglais (EN) :') || name;
  // Create an empty item placeholder in that category
  startGroupAdd('cafe', name.trim());
  if (data._new && data._new.cafe) {
    data._new.cafe.categorie_en = nameEn.trim();
  }
  renderSection();
}

function renameCategoryPrompt(oldCat) {
  const newFr = prompt('Nouveau nom (FR) :', oldCat);
  if (!newFr || !newFr.trim() || newFr.trim() === oldCat) return;
  const newEn = prompt('Nouveau nom (EN) :') || newFr;
  // Rename all items with this category
  (data.cafe || []).forEach(item => {
    if (item.categorie_fr === oldCat) {
      item.categorie_fr = newFr.trim();
      item.categorie_en = newEn.trim();
    }
  });
  renderSection();
  toast('Catégorie renommée (pensez à sauvegarder)');
}

function deleteCategory(cat) {
  const items = (data.cafe || []).filter(it => it.categorie_fr === cat);
  if (items.length > 0) {
    if (!confirm(`Supprimer la catégorie "${cat}" et ses ${items.length} élément(s) ?`)) return;
    data.cafe = (data.cafe || []).filter(it => it.categorie_fr !== cat);
  }
  // Reset expanded indices
  expandedItems.cafe = new Set();
  renderSection();
  toast('Catégorie supprimée (pensez à sauvegarder)');
}

function moveItem(sectionKey, idx, direction) {
  const arr = data[sectionKey];
  const newIdx = idx + direction;
  if (newIdx < 0 || newIdx >= arr.length) return;
  [arr[idx], arr[newIdx]] = [arr[newIdx], arr[idx]];

  // Adjust expanded indices
  if (expandedItems[sectionKey]) {
    const adjusted = new Set();
    expandedItems[sectionKey].forEach(i => {
      if (i === idx) adjusted.add(newIdx);
      else if (i === newIdx) adjusted.add(idx);
      else adjusted.add(i);
    });
    expandedItems[sectionKey] = adjusted;
  }

  renderSection();
}

/* ══════════════════════════════════════
   HORAIRE DUPLICATION
   ══════════════════════════════════════ */
function duplicateHoraireDay(sourceDay) {
  const allItems = data.horaires || [];
  const lieu = horaireFilter;
  const sourceItems = allItems.filter(it => (it.lieu || 'cafe') === lieu && it.jour_fr === sourceDay);

  if (sourceItems.length === 0) {
    toast('Aucun horaire à dupliquer pour ce jour.', true);
    return;
  }

  // Get all OTHER day names for this lieu
  const otherDays = [...new Set(
    allItems.filter(it => (it.lieu || 'cafe') === lieu && it.jour_fr !== sourceDay).map(it => it.jour_fr)
  )];

  if (otherDays.length === 0) {
    toast('Aucun autre jour existant. Ajoutez d\'abord des horaires pour d\'autres jours.', true);
    return;
  }

  if (!confirm(`Dupliquer les horaires de "${sourceDay}" (${lieu === 'cafe' ? 'Café' : 'Boutique'}) sur ${otherDays.length} autre(s) jour(s) ?\n\nJours concernés : ${otherDays.join(', ')}\n\nLes horaires existants de ces jours seront remplacés.`)) return;

  // For each target day, remove existing items and add copies of source
  for (const targetDay of otherDays) {
    // Find the EN label for target day from existing items
    const existingTarget = allItems.find(it => (it.lieu || 'cafe') === lieu && it.jour_fr === targetDay);
    const targetDayEn = existingTarget ? existingTarget.jour_en : targetDay;

    // Remove existing items for target day + lieu
    data.horaires = data.horaires.filter(it => !((it.lieu || 'cafe') === lieu && it.jour_fr === targetDay));

    // Copy source items with target day label
    for (const src of sourceItems) {
      data.horaires.push({
        ...src,
        jour_fr: targetDay,
        jour_en: targetDayEn,
      });
    }
  }

  expandedItems.horaires = new Set();
  renderSection();
  toast(`Horaires dupliqués sur ${otherDays.length} jour(s) (pensez à sauvegarder)`);
}

async function renderAnalytics() {
  const content = document.getElementById('section-content');
  content.innerHTML = '<div class="section"><h3>📊 Analytics</h3><p style="color:#888;">Chargement...</p></div>';

      const vRes = await fetch(CONFIG.FIREBASE_URL + '/analytics/visits.json');
      if (vRes.ok) visits = await vRes.json() || {};
    } catch(e) {}
    try {
      const sRes = await fetch(CONFIG.FIREBASE_URL + '/analytics/sections.json');
      if (sRes.ok) sections = await sRes.json() || {};
    } catch(e) {}

    // Sort dates descending
    const dates = Object.keys(visits).sort().reverse();
    const totalVisits = Object.values(visits).reduce((a, b) => a + (b || 0), 0);
    const todayStr = new Date().toISOString().slice(0, 10);

      '<div style="font-size:12px;color:#888;">Aujourd\'hui</div></div>';
    html += '<div style="background:#fff8ef;padding:16px;border-radius:10px;text-align:center;">' +
      '<div style="font-size:28px;font-weight:700;color:#c27a1a;">' + totalVisits + '</div>' +
      '<div style="font-size:12px;color:#888;">Total visites</div></div>';
    html += '<div style="background:#f4f0f7;padding:16px;border-radius:10px;text-align:center;">' +
      '<div style="font-size:28px;font-weight:700;color:#6a4c93;">' + dates.length + '</div>' +
      '<div style="font-size:12px;color:#888;">Jours actifs</div></div>';
    html += '</div>';

    // Visits per day table
    html += '<h4 style="margin-bottom:8px;">Visites par jour</h4>';
    if (dates.length === 0) {
      html += '<p style="color:#aaa;">Aucune donnee encore.</p>';
    } else {
      html += '<div style="max-height:300px;overflow-y:auto;border:1px solid #e5e5e5;border-radius:8px;">';
      html += '<table style="width:100%;border-collapse:collapse;font-size:13px;">';
      html += '<thead><tr style="background:#f9f9f9;position:sticky;top:0;">' +
        '<th style="padding:8px 12px;text-align:left;">Date</th>' +
        '<th style="padding:8px 12px;text-align:right;">Visites</th></tr></thead><tbody>';
      for (const d of dates.slice(0, 30)) {
        const dayName = new Date(d + 'T12:00:00').toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
        html += '<tr style="border-top:1px solid #eee;"><td style="padding:6px 12px;">' + dayName + '</td>' +
          '<td style="padding:6px 12px;text-align:right;font-weight:600;">' + (visits[d] || 0) + '</td></tr>';
      }
      html += '</tbody></table></div>';
    }

    // Sections (aggregate across all dates)
    const sectionTotals = {};
    for (const [date, secData] of Object.entries(sections)) {
      if (typeof secData === 'object' && secData) {
        for (const [sec, count] of Object.entries(secData)) {
          sectionTotals[sec] = (sectionTotals[sec] || 0) + (count || 0);
        }
      }
    }
    const secEntries = Object.entries(sectionTotals).sort((a, b) => b[1] - a[1]);
    if (secEntries.length > 0) {
      const maxSec = secEntries[0][1] || 1;
      html += '<h4 style="margin-top:20px;margin-bottom:8px;">Sections populaires</h4>';
      html += '<div style="display:flex;flex-direction:column;gap:6px;">';
      const sectionLabels = { programme: 'Programme', cafe: 'World Peace Cafe', boutique: 'Boutique', repas: 'Repas', infos: 'Infos' };
      for (const [sec, count] of secEntries) {
        const pct = Math.round((count / maxSec) * 100);
        const label = sectionLabels[sec] || sec;
        html += '<div style="display:flex;align-items:center;gap:8px;">' +
          '<div style="width:100px;font-size:13px;">' + label + '</div>' +
          '<div style="flex:1;height:20px;background:#f0f0f0;border-radius:10px;overflow:hidden;">' +
          '<div style="height:100%;width:' + pct + '%;background:linear-gradient(90deg,#2e7d53,#4caf80);border-radius:10px;transition:width 0.3s;"></div></div>' +
          '<div style="width:50px;text-align:right;font-size:12px;font-weight:600;color:#555;">' + count + '</div></div>';
      }
      html += '</div>';
    }

    // Clear analytics button
    html += '<div style="margin-top:24px;padding-top:16px;border-top:1px solid #e5e5e5;">';
    html += '<button class="btn" style="background:#c44;color:#fff;" onclick="clearAnalytics()">🗑 Effacer toutes les analytics</button>';
    html += '</div>';

    html += '</div>';
    content.innerHTML = html;
  } catch(e) {
    console.error('[Admin] Analytics error:', e);
    content.innerHTML = '<div class="section"><h3>📊 Analytics</h3><p style="color:#c44;">Erreur de chargement des analytics.<br><small>' + (e.message || e) + '</small></p></div>';
  }
}

async function clearAnalytics() {
  if (!confirm('Effacer toutes les donnees analytics ? Cette action est irreversible.')) return;
  try {
    await fetch(CONFIG.FIREBASE_URL + '/analytics.json', { method: 'DELETE' });
    toast('Analytics effacees.');
    renderAnalytics();
  } catch(e) {
    toast('Erreur lors de la suppression.', true);
  }
}

/* ══════════════════════════════════════
   PREVIEW — App-faithful rendering
   ══════════════════════════════════════ */
let pvActiveDay = null; // Active day tab in preview

function previewSection() {
  const key = currentTab;
  if (key === '__analytics__') return;
  const schema = SECTIONS[key];
  const items = data[key] || [];

  const sectionLabels = {
    programme: 'Programme',
    cafe: 'World Peace Café',
    horaires: 'Horaires',
    repas: 'Repas',
    infos: 'Informations pratiques',
    alertes: 'Alertes',
  };

  document.getElementById('preview-title').textContent = sectionLabels[key] || schema.label;
  let html = '';

  if (key === 'programme') {
    html = pvRenderProgramme(items);
  } else if (key === 'repas') {
    html = pvRenderRepas(items);
  } else if (key === 'cafe') {
    html = pvRenderCafe(items);
  } else if (key === 'horaires') {
    html = pvRenderHoraires(items);
  } else if (key === 'infos') {
    html = pvRenderInfos(items);
  } else if (key === 'alertes') {
    html = pvRenderAlertes(items);
  }

  if (items.length === 0) {
    html = '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:0.9rem;">Aucun élément à prévisualiser.</div>';
  }

  document.getElementById('preview-body').innerHTML = html;
  document.getElementById('preview-overlay').classList.add('show');
}

function pvRenderProgramme(items) {
  const dayOrder = JOUR_OPTIONS.map(j => j.value);
  const availDays = [...new Set(items.map(r => r.jour))].sort((a,b) => dayOrder.indexOf(a) - dayOrder.indexOf(b));
  if (!availDays.includes(pvActiveDay)) pvActiveDay = availDays[0] || null;

  let html = '<div class="pv-section-head"><h2>Programme</h2></div>';

  // Day pills
  html += '<div class="pv-day-strip">';
  for (const d of availDays) {
    const label = (JOUR_OPTIONS.find(j=>j.value===d)||{}).label||d;
    html += `<button class="pv-day-pill${d===pvActiveDay?' active':''}" onclick="pvSelectDay('${escAttr(d)}')">${escHtml(label)}</button>`;
  }
  html += '</div>';

  // Timeline for active day
  const dayItems = items.filter(r => r.jour === pvActiveDay);
  html += '<div class="pv-timeline">';
  dayItems.forEach(ev => {
    const evType = (ev.type || 'practical').trim();
    html += `<div class="pv-tl-event">
      <div class="pv-tl-spine"><div class="pv-tl-dot ${evType}"></div><div class="pv-tl-line"></div></div>
      <div class="pv-tl-card${evType==='ceremony'?' ceremony':''}">
        <div class="pv-tl-time">${escHtml(ev.heure||'')}</div>
        <div class="pv-tl-title">${escHtml(ev.titre_fr||'')}</div>
        ${ev.desc_fr ? '<div class="pv-tl-desc">'+escHtml(ev.desc_fr)+'</div>' : ''}
        ${ev.sadhana_fr ? '<div class="pv-tl-desc" style="font-style:italic;color:var(--green);margin-top:3px;">📖 Sadhana : '+escHtml(ev.sadhana_fr)+'</div>' : ''}
        ${ev.badge_fr ? '<span class="pv-tl-badge">'+escHtml(ev.badge_fr)+'</span>' : ''}
      </div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function pvRenderRepas(items) {
  const dayOrder = JOUR_OPTIONS.map(j => j.value);
  const mealDays = [...new Set(items.map(r => r.jour))].sort((a,b) => dayOrder.indexOf(a) - dayOrder.indexOf(b));
  if (!mealDays.includes(pvActiveDay)) pvActiveDay = mealDays[0] || null;

  let html = '<div class="pv-section-head"><h2>Repas</h2></div>';

  // Day pills
  html += '<div class="pv-day-strip">';
  for (const d of mealDays) {
    const label = (JOUR_OPTIONS.find(j=>j.value===d)||{}).label||d;
    html += `<button class="pv-day-pill${d===pvActiveDay?' active':''}" onclick="pvSelectDay('${escAttr(d)}')">${escHtml(label)}</button>`;
  }
  html += '</div>';

  // Group by service (filter out disabled services for this day)
  const dayDisabled = disabledServices[pvActiveDay] || [];
  const dayItems = items.filter(r => r.jour === pvActiveDay && !dayDisabled.includes(r.service_fr || 'Autre'));
  const services = {};
  const svcOrder = [];
  dayItems.forEach(r => {
    const svc = r.service_fr || 'Autre';
    const key = svc + '|' + (r.heure || '');
    if (!services[key]) { services[key] = { name: svc, time: r.heure || '', dishes: [] }; svcOrder.push(key); }
    services[key].dishes.push(r);
  });

  html += '<div style="padding:12px 12px 16px;">';
  for (const key of svcOrder) {
    const s = services[key];
    html += `<div class="pv-card" style="margin:0 0 12px;">
      <div class="pv-meal-svc">
        <div class="pv-meal-svc-title">${escHtml(s.name)}</div>
        <div class="pv-meal-svc-time">${escHtml(s.time)}</div>
        <div style="display:flex;flex-direction:column;gap:6px;">`;
    for (const d of s.dishes) {
      let diets = [];
      if (d.vegan === true || d.vegan === 'true') diets.push('veg');
      if (d.sans_gluten === true || d.sans_gluten === 'true') diets.push('vgf');
      const dietLabels = {veg:'Végétarien', vgf:'Végan SG'};
      const allergenCodes = (d.allergenes||'').split(',').map(x=>x.trim()).filter(Boolean);
      html += `<div class="pv-meal-dish">
        <div class="pv-meal-dish-name">${escHtml(d.plat_fr||'')}</div>
        ${diets.length ? '<div class="pv-diet-badges">' + diets.map(dt => '<span class="pv-diet-badge '+dt+'">'+(dietLabels[dt]||dt)+'</span>').join('') + '</div>' : ''}
        ${allergenCodes.length ? '<div class="pv-allergen-chips">' + allergenCodes.map(c => {
          const a = ALLERGEN_LIST.find(x=>x.code===c);
          return '<span class="pv-allergen-chip">'+(a?a.icon+' '+a.label:c)+'</span>';
        }).join('') + '</div>' : ''}
      </div>`;
    }
    html += '</div></div></div>';
  }
  html += '</div>';
  return html;
}

function pvRenderCafe(items) {
  let html = '<div class="pv-section-head"><h2>World Peace Café</h2></div>';

  if (!cafeVisible) {
    html += '<div style="text-align:center;padding:30px;color:var(--text-muted);font-size:0.9rem;">🚫 La carte est masquée sur l\'app</div>';
    return html;
  }

  // Group by category
  const cats = {};
  const catOrder = [];
  items.forEach(it => {
    const cat = it.categorie_fr || 'Autre';
    if (!cats[cat]) { cats[cat] = []; catOrder.push(cat); }
    cats[cat].push(it);
  });

  html += '<div style="padding:12px;"><div class="pv-card">';
  html += '<div class="pv-card-header"><div class="pv-card-icon cafe">☕</div><div><div class="pv-card-title">World Peace Café</div></div></div>';

  for (const cat of catOrder) {
    html += `<div class="pv-menu-cat"><div class="pv-menu-cat-label">${escHtml(cat)}</div>`;
    for (const it of cats[cat]) {
      html += `<div class="pv-menu-row"><span class="pv-menu-name">${escHtml(it.nom_fr||'')}</span><span class="pv-menu-price">${escHtml(it.prix||'')}</span></div>`;
    }
    html += '</div>';
  }
  html += '<div class="pv-menu-note">Paiement par carte bancaire, espèces ou virement instantané.</div>';
  html += '</div></div>';
  return html;
}

function pvRenderHoraires(items) {
  let html = '';

  // Café hours
  const cafeItems = items.filter(it => (it.lieu||'cafe') === 'cafe');
  if (cafeItems.length) {
    html += '<div style="padding:12px 12px 0;"><div class="pv-card">';
    html += '<div class="pv-card-header"><div class="pv-card-icon cafe">☕</div><div><div class="pv-card-title">World Peace Café</div></div></div>';
    cafeItems.forEach(it => {
      html += `<div class="pv-hours-row"><span class="pv-hours-day">${escHtml(it.jour_fr||'')}</span><span class="pv-hours-time">${escHtml(it.ouverture||'')} – ${escHtml(it.fermeture||'')}</span></div>`;
    });
    html += '</div></div>';
  }

  // Boutique hours
  const shopItems = items.filter(it => it.lieu === 'shop');
  if (shopItems.length) {
    html += '<div style="padding:12px;"><div class="pv-card">';
    html += '<div class="pv-card-header"><div class="pv-card-icon shop">🛍</div><div><div class="pv-card-title">Boutique du Dharma</div></div></div>';
    shopItems.forEach(it => {
      html += `<div class="pv-hours-row"><span class="pv-hours-day">${escHtml(it.jour_fr||'')}</span><span class="pv-hours-time">${escHtml(it.ouverture||'')} – ${escHtml(it.fermeture||'')}</span></div>`;
    });
    html += '</div></div>';
  }

  return html;
}

function pvRenderInfos(items) {
  let html = '<div class="pv-section-head"><h2>Informations pratiques</h2></div>';
  html += '<div style="padding:12px;">';
  items.forEach(it => {
    html += `<div class="pv-card">
      <div style="font-family:var(--font-display);font-size:17px;font-weight:600;color:var(--text);margin-bottom:6px;">${escHtml(it.titre_fr||'')}</div>
      <div style="font-size:13px;color:var(--text-secondary);line-height:1.5;">${it.contenu_fr||''}</div>
    </div>`;
  });
  html += '</div>';
  return html;
}

function pvRenderAlertes(items) {
  let html = '<div class="pv-section-head"><h2>Alertes</h2></div>';
  html += '<div style="padding:12px;">';
  items.filter(it => it.actif === 'oui').forEach(it => {
    html += `<div class="pv-card" style="border-left:3px solid var(--saffron);">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;">
        <span style="font-size:20px;">${it.emoji||'⚠️'}</span>
        <span style="font-family:var(--font-display);font-size:16px;font-weight:700;color:var(--text);">${escHtml(it.titre_fr||'')}</span>
      </div>
      <div style="font-size:13px;color:var(--text-secondary);line-height:1.5;">${it.contenu_fr||''}</div>
    </div>`;
  });
  const inactive = items.filter(it => it.actif !== 'oui');
  if (inactive.length) {
    html += '<div style="font-size:0.8rem;color:var(--text-muted);margin-top:8px;">+ ' + inactive.length + ' alerte(s) inactive(s)</div>';
  }
  html += '</div>';
  return html;
}

function pvSelectDay(day) {
  pvActiveDay = day;
  previewSection();
}

function closePreview() {
  document.getElementById('preview-overlay').classList.remove('show');
}
