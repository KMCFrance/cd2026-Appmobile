// Show preview
const preview = document.getElementById('preview');
Object.entries(DATA).forEach(([key, arr]) => {
  const tr = document.createElement('tr');
  tr.innerHTML = '<td>' + key + '</td><td>' + arr.length + ' éléments</td>';
  preview.appendChild(tr);
});

async function doMigrate() {
  const output = document.getElementById('output');
  const btn = document.getElementById('migrateBtn');

  btn.disabled = true;
  btn.textContent = 'Migration en cours...';
  output.innerHTML = '<div class="status info">Écriture dans Firebase...</div>';

  try {
    const resp = await fetch(FIREBASE_URL + '/data.json', {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(DATA)
    });

    if (!resp.ok) throw new Error('Erreur Firebase: ' + resp.status);

    // Verify
    const verifyResp = await fetch(FIREBASE_URL + '/data.json');
    const verifyData = await verifyResp.json();
    const verifySections = verifyData ? Object.keys(verifyData) : [];

    let summary = 'Migration terminée avec succès !\n\n';
    summary += 'Sections écrites :\n';
    Object.entries(DATA).forEach(([key, arr]) => {
      const ok = verifySections.includes(key) ? ' OK' : ' MANQUANTE';
      summary += '  - ' + key + ' : ' + arr.length + ' éléments' + ok + '\n';
    });
    summary += '\nVous pouvez maintenant ouvrir index.html pour voir l\'app.';

    output.innerHTML = '<div class="status success">' + summary + '</div>';

  } catch (e) {
    output.innerHTML = '<div class="status error">Erreur : ' + e.message + '\n\nVérifiez que les règles Firebase autorisent l\'écriture sur /data.</div>';
  }

  btn.disabled = false;
  btn.textContent = 'Relancer la migration';
}
